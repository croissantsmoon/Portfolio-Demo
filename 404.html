<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Alex Morgan Rivera</title>
  <script>
    // GitHub Pages SPA fallback: encode the requested path as ?p= and redirect to index.html.
    // index.html reads ?p=, restores the clean URL via history.replaceState, and renders the page.
    (function () {
      var path = window.location.pathname || '/';
      var qs = window.location.search ? '&' + window.location.search.slice(1) : '';
      window.location.replace(
        window.location.protocol + '//' + window.location.host +
        '/?p=' + encodeURIComponent(path) + qs
      );
    })();
  </script>
</head>
<body></body>
</html>
